name: Audit RC7 runtime reports

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-rc7-runtime-reports.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      OPENMW_REPO: munument1/-KR-openmw
      OPENMW_TAG: openmw-0.51.0-kr1
      OPENMW_ASSET: Morrowind-Korean-OpenMW-0.51.0-KR1-Full.zip
      RC7_TAG: v1.0.7-rc7-classic-cp949
      RC7_ASSET: Morrowind_Classic_CP949_Korean_v1.0.7-rc7_Full.zip
    steps:
      - uses: actions/checkout@v4

      - name: Download OpenMW KR1 and current RC7
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/runtime-audit
          mkdir -p build/runtime-audit/openmw build/runtime-audit/rc7 build/runtime-audit/mo2
          gh release download "$OPENMW_TAG" --repo "$OPENMW_REPO" --pattern "$OPENMW_ASSET" --dir build/runtime-audit
          gh release download "$RC7_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$RC7_ASSET" --dir build/runtime-audit
          unzip -q "build/runtime-audit/$OPENMW_ASSET" -d build/runtime-audit/openmw
          unzip -q "build/runtime-audit/$RC7_ASSET" -d build/runtime-audit/rc7
          nested="$(find build/runtime-audit/rc7 -maxdepth 1 -type f -name '*_MO2.zip' -print -quit)"
          test -n "$nested"
          unzip -q "$nested" -d build/runtime-audit/mo2

      - name: Audit GMST, CEL, questions and font templates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, struct

          root = Path('build/runtime-audit')
          rc7_esp = next((root/'mo2').glob('*.esp'))
          openmw_esp = next((root/'openmw').rglob('Morrowind_Korean_ReTranslation.esp'))
          cel = next((root/'mo2').glob('*.cel'))
          ini = root/'rc7'/'Morrowind_Korean_INI.ini'

          keys = [
              'sMessageQuestionAnswer1','sMessageQuestionAnswer2','sMessageQuestionAnswer3',
              'sClassChoiceMenu1','sClassChoiceMenu2','sClassChoiceMenu3',
              'sChooseClassMenu1','sChooseClassMenu2','sChooseClassMenu3','sChooseClassMenu4',
              'sYes','sNo','sTo','sClass','sSpecialization','sFavoriteAttributes','sMajorSkills','sMinorSkills',
          ]

          def records(path):
              data=path.read_bytes(); off=0
              while off+16<=len(data):
                  typ=data[off:off+4].decode('ascii','replace')
                  size=struct.unpack_from('<I',data,off+4)[0]
                  payload=data[off+16:off+16+size]
                  yield typ,payload
                  off += 16+size

          def subs(payload):
              off=0
              while off+8<=len(payload):
                  n=payload[off:off+4].decode('ascii','replace')
                  sz=struct.unpack_from('<I',payload,off+4)[0]
                  yield n,payload[off+8:off+8+sz]
                  off += 8+sz

          def gmsts(path, enc):
              out={}
              for typ,p in records(path):
                  if typ!='GMST': continue
                  d=dict(subs(p))
                  name=d.get('NAME',b'').split(b'\0',1)[0].decode('ascii','replace')
                  if 'STRV' in d:
                      out[name]=d['STRV'].split(b'\0',1)[0].decode(enc,'replace')
              return out

          rc=gmsts(rc7_esp,'cp949')
          om=gmsts(openmw_esp,'utf-8')
          print('=== SELECTED GMST ===')
          for k in keys:
              print(json.dumps({'key':k,'rc7':rc.get(k),'openmw':om.get(k)},ensure_ascii=True))

          print('=== CEL EARLY GAME ===')
          rows=[]
          for raw in cel.read_bytes().decode('cp949').splitlines():
              if '\t' in raw:
                  a,b=raw.split('\t',1); rows.append((a,b))
          wanted=['Imperial Prison Ship','Seyda Neen','Seyda Neen, Census and Excise Office',
                  'Seyda Neen, Census and Excise Warehouse',"Seyda Neen, Arrille's Tradehouse",
                  'Seyda Neen, Lighthouse']
          m=dict(rows)
          for k in wanted:
              print(json.dumps({'source':k,'translation':m.get(k)},ensure_ascii=True))
          print('cel_rows',len(rows))

          print('=== QUESTION OVERLAY ===')
          txt=ini.read_bytes().decode('cp949')
          for line in txt.splitlines():
              if line.startswith('Question='):
                  v=line.split('=',1)[1]
                  print(json.dumps({'chars':len(v),'cp949_bytes':len(v.encode('cp949')),'sample':v[:50]},ensure_ascii=True))

          print('=== FNT 0xFF TEMPLATE ===')
          FNT_HEADER=12+284; GLYPH=14*4
          for f in sorted((root/'mo2'/'Fonts').glob('*.fnt')):
              raw=f.read_bytes(); vals=struct.unpack_from('<14f',raw,FNT_HEADER+0xFF*GLYPH)
              print(json.dumps({'font':f.name,'uv':list(vals[1:9]),'width':vals[9],'height':vals[10],'advance':vals[13]},ensure_ascii=True))
          PY
