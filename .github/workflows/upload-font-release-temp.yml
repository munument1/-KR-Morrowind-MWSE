name: Upload Classic CP949 font pack to RC7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upload-font-release-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.0.7-rc7-classic-cp949
      REPO: ${{ github.repository }}
      EXPECTED_SHA: 3a7d2442d43d7ed9e0b42d6d8d75068340b00893e06bb2fa696d4ac440bbeee7
      ASSET: Morrowind_CP949_Classic_Fonts.zip
      SOURCE_REF: origin/font-release-upload-temp-20260808
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact RC6 font pack from retained parts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin font-release-upload-temp-20260808
          rm -rf /tmp/fontparts
          git worktree add --detach /tmp/fontparts "$SOURCE_REF"
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, os, re

          all_parts = sorted(Path('/tmp/fontparts/.release-upload/parts').glob('part_*.b64'))
          parts = [p for p in all_parts if p.read_text(encoding='utf-8', errors='ignore').strip() != 'PLACEHOLDER']
          if not parts:
              raise SystemExit('no retained font-pack data parts found')
          print(f'Restoring {len(parts)} retained RC6 font-pack data parts')

          segments = []
          for p in parts:
              clean = re.sub(rb'[^A-Za-z0-9+/=]', b'', p.read_bytes())
              print(f'{p.name}: chars={len(clean)}')
              segments.append(clean)

          joined = b''.join(segments).rstrip(b'=')
          joined += b'=' * ((-len(joined)) % 4)
          stream = base64.b64decode(joined, validate=True)
          if not stream.startswith(b'\xfd7zXZ\x00'):
              raise SystemExit(f'unexpected retained stream header: {stream[:8].hex()}')
          payload = lzma.decompress(stream)

          out = Path('/tmp') / os.environ['ASSET']
          out.write_bytes(payload)
          got = hashlib.sha256(payload).hexdigest()
          expected = os.environ['EXPECTED_SHA']
          print('font pack SHA-256:', got)
          if got != expected:
              raise SystemExit(f'font-pack SHA mismatch: {got} != {expected}')
          PY
          unzip -tq "/tmp/$ASSET"

      - name: Upload RC6 font pack to RC7
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" "/tmp/$ASSET" --clobber --repo "$REPO"
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[] | select(.name==env.ASSET) | {name: .name, size: .size}'
