name: Upload Classic CP949 font pack to RC7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upload-font-release-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.0.7-rc7-classic-cp949
      REPO: ${{ github.repository }}
      RC6_TAG: v1.0.7-rc6-classic-cp949-pre1
      RC6_ASSET: Morrowind_Korean_ReTranslation_v1.0.7-rc6_Classic_CP949.zip
      ASSET: Morrowind_CP949_Classic_Fonts.zip
    steps:
      - uses: actions/checkout@v4

      - name: Recover the RC6 font payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rc6 /tmp/nested /tmp/fontroot
          mkdir -p /tmp/rc6 /tmp/nested /tmp/fontroot
          gh release download "$RC6_TAG" --repo "$REPO" --pattern "$RC6_ASSET" --dir /tmp
          unzip -q "/tmp/$RC6_ASSET" -d /tmp/rc6

          echo '=== RC6 outer package files ==='
          find /tmp/rc6 -maxdepth 5 -type f -printf '%P\n' | sort

          # Inspect every nested ZIP in the RC6 package as well.
          i=0
          while IFS= read -r -d '' z; do
            d="/tmp/nested/$i"
            mkdir -p "$d"
            unzip -q "$z" -d "$d" || true
            echo "=== nested ZIP: ${z#/tmp/rc6/} ==="
            find "$d" -maxdepth 6 -type f -printf '%P\n' | sort
            i=$((i+1))
          done < <(find /tmp/rc6 -type f -iname '*.zip' -print0)

          # Collect the exact RC6 FNT/TEX files without modifying their bytes.
          mapfile -t fontfiles < <(find /tmp/rc6 /tmp/nested -type f \( -iname '*.fnt' -o -iname '*.tex' \) | sort)
          if [[ ${#fontfiles[@]} -eq 0 ]]; then
            echo 'No FNT/TEX files were found inside the RC6 release package.' >&2
            exit 44
          fi
          printf 'Found %d RC6 font files\n' "${#fontfiles[@]}"
          printf '%s\n' "${fontfiles[@]}"

          mkdir -p '/tmp/fontroot/Data Files/Fonts'
          for f in "${fontfiles[@]}"; do
            cp -p "$f" "/tmp/fontroot/Data Files/Fonts/$(basename "$f")"
          done
          (cd /tmp/fontroot && zip -q -9 -r "/tmp/$ASSET" 'Data Files')
          unzip -tq "/tmp/$ASSET"
          sha256sum "/tmp/$ASSET"
          sha256sum '/tmp/fontroot/Data Files/Fonts/'* | sort

      - name: Upload RC6 font files unchanged to RC7
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" "/tmp/$ASSET" --clobber --repo "$REPO"
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[] | select(.name==env.ASSET) | {name: .name, size: .size, digest: .digest}'
