name: Upload Classic CP949 font pack to RC7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upload-font-release-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.0.7-rc7-classic-cp949
      REPO: ${{ github.repository }}
      EXPECTED_SHA: 3a7d2442d43d7ed9e0b42d6d8d75068340b00893e06bb2fa696d4ac440bbeee7
      ASSET: Morrowind_CP949_Classic_Fonts.zip
      SOURCE_REF: origin/font-release-upload-temp-20260808
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact RC6 font pack from retained parts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin font-release-upload-temp-20260808
          rm -rf /tmp/fontparts
          git worktree add --detach /tmp/fontparts "$SOURCE_REF"
          : > /tmp/fontpack.xz
          shopt -s nullglob
          parts=(/tmp/fontparts/.release-upload/parts/part_*.b64)
          test "${#parts[@]}" -gt 0
          printf 'Restoring %d retained RC6 font-pack parts\n' "${#parts[@]}"
          for part in "${parts[@]}"; do
            base64 --decode --ignore-garbage "$part" >> /tmp/fontpack.xz
          done
          xz -t /tmp/fontpack.xz
          xz --decompress --stdout /tmp/fontpack.xz > "/tmp/$ASSET"
          echo "$EXPECTED_SHA  /tmp/$ASSET" | sha256sum -c -
          unzip -tq "/tmp/$ASSET"

      - name: Upload RC6 font pack to RC7
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" "/tmp/$ASSET" --clobber --repo "$REPO"
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[] | select(.name==env.ASSET) | {name: .name, size: .size}'
