name: Audit OpenMW KR1 display diffs

on:
  push:
    branches: [main]
    paths:
      - 'tools/audit_openmw_kr1_display_diffs.py'
      - '.github/workflows/audit-openmw-kr1-display-diffs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      OPENMW_REPO: munument1/-KR-openmw
      OPENMW_TAG: openmw-0.51.0-kr1
      OPENMW_ASSET: Morrowind-Korean-OpenMW-0.51.0-KR1-Full.zip
      CP949_TAG: v1.0.7-rc6-classic-cp949-pre1
      CP949_ASSET: Morrowind_Korean_ReTranslation_v1.0.7-rc6_Classic_CP949.zip
    steps:
      - uses: actions/checkout@v4
      - name: Download inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/openmw build/cp949 build/cp949-outer
          gh release download "$OPENMW_TAG" --repo "$OPENMW_REPO" --pattern "$OPENMW_ASSET" --dir build
          gh release download "$CP949_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$CP949_ASSET" --dir build
          unzip -q "build/$OPENMW_ASSET" -d build/openmw
          unzip -q "build/$CP949_ASSET" -d build/cp949-outer
          nested="$(find build/cp949-outer -type f -name 'Korean Translation.zip' -print -quit)"
          test -n "$nested"
          unzip -q "$nested" -d build/cp949

      - name: Inspect chargen GMST values
        shell: bash
        run: |
          set -euo pipefail
          omw="$(find build/openmw -type f -name 'Morrowind_Korean_ReTranslation.esp' -print -quit)"
          cp="$(find build/cp949 -type f -name 'Morrowind_Korean_ReTranslation.esp' -print -quit)"
          python3 - "$omw" "$cp" <<'PY'
          import struct,sys
          ids={
            'sClassChoiceMenu1','sClassChoiceMenu2','sClassChoiceMenu3',
            'sMessageQuestionAnswer1','sMessageQuestionAnswer2','sMessageQuestionAnswer3',
            'sCreateClassMenuWarning','sChooseClassMenu1','sChooseClassMenu2','sChooseClassMenu3','sChooseClassMenu4',
            'sClass','sSpecialization','sMajorSkills','sMinorSkills','sFavoriteAttributes',
            'sYes','sNo','sOK','sCancel'
          }
          def records(blob):
            p=0
            while p<len(blob):
              rt=blob[p:p+4]; sz=struct.unpack_from('<I',blob,p+4)[0]; end=p+16+sz; q=p+16; ss=[]
              while q<end:
                st=blob[q:q+4]; n=struct.unpack_from('<I',blob,q+4)[0]; ss.append((st,blob[q+8:q+8+n])); q+=8+n
              yield rt,ss; p=end
          def decode(b,kind):
            b=b.rstrip(b'\0')
            encs=('utf-8-sig','utf-8','cp1252','latin1') if kind=='OPENMW' else ('cp949','utf-8-sig','utf-8','cp1252','latin1')
            for e in encs:
              try:return b.decode(e)
              except UnicodeDecodeError: pass
            return repr(b)
          def dump(path,kind):
            found={}
            for rt,ss in records(open(path,'rb').read()):
              if rt!=b'GMST':continue
              d={k:v for k,v in ss}; name=decode(d.get(b'NAME',b''),kind)
              if name in ids:found[name]=decode(d.get(b'STRV',b''),kind)
            print('===',kind,'GMST ===')
            for k in sorted(ids): print(k,'=',repr(found.get(k,'<MISSING>')))
          dump(sys.argv[1],'OPENMW'); dump(sys.argv[2],'CP949')
          PY

      - name: Inspect KR1 CEL and RC6 exe
        shell: bash
        run: |
          set -euo pipefail
          cel='build/openmw/mods/Morrowind_Korean_ReTranslation/Morrowind_Korean_ReTranslation.cel'
          echo '=== CEL KEY ROWS ==='
          grep -nE 'Seyda Neen|Region|Balmora' "$cel" | head -80 || true
          echo '=== RC6 BUNDLED EXE ==='
          rc6exe="$(find build/cp949-outer -type f -iname 'Morrowind.exe' -print -quit)"
          sha256sum "$rc6exe"
          python3 - "$rc6exe" <<'PY'
          import sys
          b=open(sys.argv[1],'rb').read(); off=0x3457C0
          patch=bytes.fromhex('5589e58b4d080fb70186c480fc81723480fcfd772f80ec813c4172283c5a76143c6172203c7a76103c8172183cfe77142c4deb062c41eb022c47503e8b4d0ce915000000e987000000')
          print('size',len(b)); print('matches_current_cp949_patch',b[off:off+len(patch)]==patch)
          PY

      - name: Audit display fields
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_openmw_kr1_display_diffs.py --openmw-root build/openmw --cp949-root build/cp949 --out build/kr1_display_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: kr1-display-audit
          path: build/kr1_display_audit.json
