name: Cleanup broken RC7 font tuning asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-rc7-broken-font-asset.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale broken font tuning asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete-asset v1.0.7-rc7-classic-cp949 classic_cp949_font_tuning.json --repo "$GITHUB_REPOSITORY" --yes
