name: Create RC7 Classic CP949 release

on:
  push:
    branches: [main]
    paths:
      - 'tools/port_openmw_kr1_topic_links.py'
      - 'tools/port_openmw_kr1_classic_sidecars.py'
      - 'tools/patch_morrowind_cp949.py'
      - 'tools/Apply_CP949_Patch.bat'
      - '.github/workflows/create-rc7-prerelease.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      OPENMW_REPO: munument1/-KR-openmw
      OPENMW_TAG: openmw-0.51.0-kr1
      OPENMW_ASSET: Morrowind-Korean-OpenMW-0.51.0-KR1-Full.zip
      CP949_REPO: munument1/-KR-Morrowind-MWSE
      CP949_TAG: v1.0.7-rc6-classic-cp949-pre1
      CP949_ASSET: Morrowind_Korean_ReTranslation_v1.0.7-rc6_Classic_CP949.zip
      CP949_ASSET_SHA256: 0dc5f9ec99544dc12560f5844c8d0cf019e9214925ebbac50af4b3e5e51e891e
      TAG: v1.0.7-rc7-classic-cp949
      OUT_DIR: build/rc7
      FULL_ZIP: Morrowind_Classic_CP949_Korean_v1.0.7-rc7_Full.zip
      MO2_ZIP: Morrowind_Korean_ReTranslation_v1.0.7-rc7_MO2.zip

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Download pinned reference assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/downloads/openmw build/downloads/cp949 build/input/openmw build/input/cp949
          gh release download "$OPENMW_TAG" --repo "$OPENMW_REPO" --pattern "$OPENMW_ASSET" --dir build/downloads/openmw
          gh release download "$CP949_TAG" --repo "$CP949_REPO" --pattern "$CP949_ASSET" --dir build/downloads/cp949
          echo "$CP949_ASSET_SHA256  build/downloads/cp949/$CP949_ASSET" | sha256sum -c -
          unzip -q "build/downloads/openmw/$OPENMW_ASSET" -d build/input/openmw
          unzip -q "build/downloads/cp949/$CP949_ASSET" -d build/input/cp949-outer
          nested="$(find build/input/cp949-outer -type f -name 'Korean Translation.zip' -print -quit)"
          test -n "$nested"
          unzip -q "$nested" -d build/input/cp949

      - name: Build and validate RC7 translation payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          python3 tools/port_openmw_kr1_topic_links.py \
            --openmw-root build/input/openmw \
            --cp949-root build/input/cp949 \
            --output-dir "$OUT_DIR"

          validation="$OUT_DIR/Morrowind_Korean_ReTranslation_KR1_TopicFix_Classic_CP949_validation.json"
          test "$(jq -r '.status' "$validation")" = PASS
          test "$(jq -r '.output.marker_only_info_changed' "$validation")" = 7692
          test "$(jq -r '.output.content_changes_skipped' "$validation")" = 177
          test "$(jq -r '.output.top_rows' "$validation")" = 5843
          test "$(jq -r '.output.mrk_rows' "$validation")" = 376
          test "$(jq -r '.output.unresolved_markers | length' "$validation")" = 0
          test "$(jq -r '.cp949_fallbacks | length' "$validation")" = 0
          test "$(jq -r '.checks.compiled_scripts_byte_identical' "$validation")" = true
          test "$(jq -r '.checks.classic_dials_byte_semantics_preserved' "$validation")" = true
          test "$(jq -r '.checks.only_expected_info_names_changed' "$validation")" = true
          test "$(jq -r '.checks.classic_voice_wilderness_fix_preserved' "$validation")" = true

      - name: Port and validate KR1 Classic sidecars and INI strings
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/port_openmw_kr1_classic_sidecars.py \
            --openmw-root build/input/openmw \
            --output-dir "$OUT_DIR/sidecars"

          side="$OUT_DIR/sidecars/classic_sidecars_validation.json"
          test "$(jq -r '.status' "$side")" = PASS
          test "$(jq -r '.question_entries' "$side")" = 40
          test "$(jq -r '.level_up_entries' "$side")" = 20
          test "$(jq -r '.blood_name_entries' "$side")" = 3
          test "$(jq -r '.ini_display_entries' "$side")" = 63
          test "$(jq -r '.cel_rows' "$side")" = 1439
          test -s "$OUT_DIR/sidecars/Morrowind_Korean_ReTranslation.cel"
          test -s "$OUT_DIR/sidecars/Morrowind_Korean_INI.ini"
          test "$(grep -c '^\[' "$OUT_DIR/sidecars/Morrowind_Korean_INI.ini")" = 12
          test "$(grep -c '=' "$OUT_DIR/sidecars/Morrowind_Korean_INI.ini")" = 63
          ! grep -qE '^(Sound|Model [0-9]|Texture [0-9]|Font [0-9])=' "$OUT_DIR/sidecars/Morrowind_Korean_INI.ini"

      - name: Assemble nested MO2 archive and outer full package
        shell: bash
        run: |
          set -euo pipefail
          full="$OUT_DIR/full"
          mo2="$OUT_DIR/mo2-package"
          mkdir -p "$full" "$mo2/Fonts"

          # MO2 archive: data-directory contents at archive root.
          cp "$OUT_DIR/MO2/Morrowind_Korean_ReTranslation.esp" "$mo2/"
          cp "$OUT_DIR/MO2/Morrowind_Korean_ReTranslation.top" "$mo2/"
          cp "$OUT_DIR/MO2/Morrowind_Korean_ReTranslation.mrk" "$mo2/"
          cp "$OUT_DIR/sidecars/Morrowind_Korean_ReTranslation.cel" "$mo2/"

          # Reuse the exact eight Classic CP949 font files from RC6.
          src='build/input/cp949-outer/Morrowind/Data Files/Fonts'
          test -d "$src"
          cp -p "$src"/*.fnt "$src"/*.tex "$mo2/Fonts/"
          test "$(find "$mo2/Fonts" -type f | wc -l)" = 8
          (cd "$mo2" && sha256sum -c - <<'EOF'
          a4100e60a1bac906c9b1c631d6302b337db3b3f6cec1dca6c4c870d018c384da  Fonts/Magic_Cards_Regular.fnt
          2bc62d3aa56375e118e9cd172a1c1be4a5d40619a537f917eb8acced607c6284  Fonts/Magic_Cards_Regular_0_Lod_A.tex
          478eb1f662282b45900e966909824d9fdadd32ab2466d4321dd000d2bdb774b1  Fonts/century_gothic_big.fnt
          849d052c9fdec6610a54edf19c1a10617f91502c8e7ba1ae0941791282a3e0ff  Fonts/century_gothic_big_0_Lod_A.tex
          3b9fe4504f407b90899ce288883c644a4a34aee0abec3274e90e32339c4c5e69  Fonts/century_gothic_font_regular.fnt
          91602af559c7e0774907523c79a8b9ec73280f84b2787ee1b5ff9b743c05f306  Fonts/century_gothic_font_regular_0_Lod_A.tex
          328cde4221991945c4b42d78e67fad84645c2110967c42f403bbcde717d9ef0d  Fonts/daedric_font.fnt
          6af53d3fcb43653e125611acc74314320fd09ba5e23d5eee7a97c56deabd0aa3  Fonts/daedric_font_0_Lod_A.tex
          EOF
          )

          python3 - <<'PY'
          from pathlib import Path
          import os, zipfile

          def deterministic_zip(root: Path, out: Path):
              files = sorted(p for p in root.rglob('*') if p.is_file())
              with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for path in files:
                      arc = path.relative_to(root).as_posix()
                      info = zipfile.ZipInfo(arc, date_time=(1980, 1, 1, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.external_attr = 0o100644 << 16
                      zf.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

          out_dir = Path(os.environ['OUT_DIR'])
          deterministic_zip(out_dir / 'mo2-package', out_dir / 'full' / os.environ['MO2_ZIP'])
          PY

          # Outer package: root patch/INI helper + nested MO2 archive.
          cp tools/Apply_CP949_Patch.bat "$full/Apply_CP949_Patch.bat"
          cp "$OUT_DIR/sidecars/Morrowind_Korean_INI.ini" "$full/Morrowind_Korean_INI.ini"

          cat > "$full/README_RC7.txt" <<EOF
          Morrowind Classic CP949 Korean v1.0.7-rc7 - Full package

          This outer ZIP contains a nested MO2-ready archive.

          1. Extract this outer ZIP into the Morrowind game folder.
          2. Apply Morrowind Code Patch first and enable Japanese localization compatibility.
          3. Double-click Apply_CP949_Patch.bat in the game folder.
             - Patches only the CP949 text-handling code after validating the target code pattern.
             - MCP option combinations may have different whole-file SHA-256 values; that alone is not an error.
             - Backs up Morrowind.exe and Morrowind.ini when needed.
             - Merges only 63 localized INI display keys.
          4. In Mod Organizer 2, install the nested archive:
             $MO2_ZIP
          5. Enable Morrowind_Korean_ReTranslation.esp in MO2 and disable older Korean translation ESPs.

          The nested MO2 ZIP contains at its data root:
          - Morrowind_Korean_ReTranslation.esp/.top/.mrk/.cel
          - Fonts/*.fnt + *.tex (the exact eight RC6 Classic CP949 font files)

          Morrowind.exe itself is NOT included. Python is NOT required for users.
          EOF

          test -s "$full/Apply_CP949_Patch.bat"
          test -s "$full/Morrowind_Korean_INI.ini"
          test -s "$full/$MO2_ZIP"
          grep -q 'Japanese-localization code pattern verified' "$full/Apply_CP949_Patch.bat"
          grep -q 'entryCount -ne 63' "$full/Apply_CP949_Patch.bat"

          unzip -tq "$full/$MO2_ZIP"
          unzip -Z1 "$full/$MO2_ZIP" | grep -qx 'Morrowind_Korean_ReTranslation.esp'
          unzip -Z1 "$full/$MO2_ZIP" | grep -qx 'Morrowind_Korean_ReTranslation.top'
          unzip -Z1 "$full/$MO2_ZIP" | grep -qx 'Morrowind_Korean_ReTranslation.mrk'
          unzip -Z1 "$full/$MO2_ZIP" | grep -qx 'Morrowind_Korean_ReTranslation.cel'
          test "$(unzip -Z1 "$full/$MO2_ZIP" | grep -c '^Fonts/.*\.\(fnt\|tex\)$')" = 8
          ! unzip -Z1 "$full/$MO2_ZIP" | grep -q '^Data Files/'

          python3 - <<'PY'
          from pathlib import Path
          import os, zipfile

          root = Path(os.environ['OUT_DIR']) / 'full'
          out = Path(os.environ['OUT_DIR']) / os.environ['FULL_ZIP']
          files = sorted(p for p in root.rglob('*') if p.is_file())
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in files:
                  arc = path.relative_to(root).as_posix()
                  info = zipfile.ZipInfo(arc, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  zf.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          PY

          unzip -tq "$OUT_DIR/$FULL_ZIP"
          unzip -Z1 "$OUT_DIR/$FULL_ZIP" | grep -qx "$MO2_ZIP"
          unzip -Z1 "$OUT_DIR/$FULL_ZIP" | grep -qx 'Apply_CP949_Patch.bat'
          unzip -Z1 "$OUT_DIR/$FULL_ZIP" | grep -qx 'Morrowind_Korean_INI.ini'
          ! unzip -Z1 "$OUT_DIR/$FULL_ZIP" | grep -q '^Data Files/'

          validation="$OUT_DIR/Morrowind_Korean_ReTranslation_KR1_TopicFix_Classic_CP949_validation.json"
          side="$OUT_DIR/sidecars/classic_sidecars_validation.json"
          : > "$OUT_DIR/SHA256SUMS.txt"
          sha256sum "$OUT_DIR/$FULL_ZIP" "$full/$MO2_ZIP" "$validation" "$side" >> "$OUT_DIR/SHA256SUMS.txt"
          sha256sum "$mo2/Morrowind_Korean_ReTranslation.esp" "$mo2/Morrowind_Korean_ReTranslation.top" "$mo2/Morrowind_Korean_ReTranslation.mrk" "$mo2/Morrowind_Korean_ReTranslation.cel" >> "$OUT_DIR/SHA256SUMS.txt"
          sha256sum "$mo2/Fonts/"* >> "$OUT_DIR/SHA256SUMS.txt"
          sha256sum "$full/Apply_CP949_Patch.bat" "$full/Morrowind_Korean_INI.ini" >> "$OUT_DIR/SHA256SUMS.txt"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          validation="$OUT_DIR/Morrowind_Korean_ReTranslation_KR1_TopicFix_Classic_CP949_validation.json"
          side="$OUT_DIR/sidecars/classic_sidecars_validation.json"
          full_hash="$(sha256sum "$OUT_DIR/$FULL_ZIP" | awk '{print $1}')"
          mo2_hash="$(sha256sum "$OUT_DIR/full/$MO2_ZIP" | awk '{print $1}')"
          esp_hash="$(jq -r '.output.esp_sha256' "$validation")"
          cel_hash="$(jq -r '.cel_sha256' "$side")"
          ini_hash="$(jq -r '.ini_overlay_sha256' "$side")"

          cat > "$OUT_DIR/RELEASE_NOTES.md" <<EOF
          Classic Morrowind 1.6.0.1820용 CP949 한국어 번역 RC7입니다.

          ## 설치 구조
          일반 사용자는 **\`$FULL_ZIP\` 하나만** 받으면 됩니다.

          바깥 ZIP을 Morrowind 게임 폴더에 풀면 다음이 나옵니다.
          - \`Apply_CP949_Patch.bat\`
          - \`Morrowind_Korean_INI.ini\`
          - \`$MO2_ZIP\` — **MO2에서 바로 설치하는 안쪽 번역 ZIP**
          - 설치 안내문

          안쪽 MO2 ZIP은 \`Data Files\` 폴더를 한 번 더 감싸지 않고 데이터 루트에 바로 다음을 둡니다.
          - ESP/TOP/MRK/CEL
          - \`Fonts/\`의 Classic CP949 폰트 8개

          ## CP949 Code Patch
          MCP에서 Japanese localization compatibility를 먼저 적용한 뒤 BAT를 실행합니다.
          BAT는 이제 전체 \`Morrowind.exe\` SHA-256만으로 차단하지 않습니다. MCP의 Better typography/UI fix 등 옵션 조합으로 전체 해시가 달라도 **0x3457C0의 Japanese-localization 코드 패턴이 정확히 일치하면 안전하게 CP949 패치를 적용**합니다. 코드 패턴이 다르면 중단합니다.

          ## 포함 번역 자원
          - 명시적 \`@topic#\` 링크 INFO 7,692개
          - TOP 5,843행 / MRK 376행
          - CEL 1,439행
          - Classic INI 표시 문자열 63개: 질문 40 + 레벨업 20 + Blood 이름 3
          - RC6 Classic CP949 폰트 8개 byte-identical
          - compiled SCPT 236개 byte-identical
          - 미해결 토픽 마커 0 / CP949 fallback 0

          ## SHA-256
          - Full ZIP: \`$full_hash\`
          - Nested MO2 ZIP: \`$mo2_hash\`
          - ESP: \`$esp_hash\`
          - CEL: \`$cel_hash\`
          - Classic INI overlay: \`$ini_hash\`
          EOF

      - name: Publish full RC7 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          validation="$OUT_DIR/Morrowind_Korean_ReTranslation_KR1_TopicFix_Classic_CP949_validation.json"
          side="$OUT_DIR/sidecars/classic_sidecars_validation.json"
          assets=("$OUT_DIR/$FULL_ZIP" "$validation" "$side" "$OUT_DIR/SHA256SUMS.txt")

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target main --title 'Morrowind Classic CP949 v1.0.7-rc7' --notes-file "$OUT_DIR/RELEASE_NOTES.md" --prerelease=false --latest
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "${assets[@]}" --clobber
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --title 'Morrowind Classic CP949 v1.0.7-rc7' --notes-file "$OUT_DIR/RELEASE_NOTES.md" --latest "${assets[@]}"
          fi

          for old in \
            Morrowind_Korean_ReTranslation_v1.0.7-rc7_Classic_CP949.zip \
            Morrowind_CP949_Executable_Patcher_v1.0.7-rc7.zip \
            Morrowind_CP949_Classic_Fonts.zip; do
            gh release delete-asset "$TAG" "$old" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          done

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | {name: .name, size: .size, digest: .digest}'
