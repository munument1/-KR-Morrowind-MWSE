name: Create RC7 Classic CP949 release

on:
  push:
    branches: [main]
    paths:
      - 'tools/port_openmw_kr1_topic_links.py'
      - 'tools/patch_morrowind_cp949.py'
      - '.github/workflows/create-rc7-prerelease.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      OPENMW_REPO: munument1/-KR-openmw
      OPENMW_TAG: openmw-0.51.0-kr1
      OPENMW_ASSET: Morrowind-Korean-OpenMW-0.51.0-KR1-Full.zip
      CP949_REPO: munument1/-KR-Morrowind-MWSE
      CP949_TAG: v1.0.7-rc6-classic-cp949-pre1
      CP949_ASSET: Morrowind_Korean_ReTranslation_v1.0.7-rc6_Classic_CP949.zip
      TAG: v1.0.7-rc7-classic-cp949
      OUT_DIR: build/rc7
      RELEASE_ZIP: Morrowind_Korean_ReTranslation_v1.0.7-rc7_Classic_CP949.zip
      PATCHER_ZIP: Morrowind_CP949_Executable_Patcher_v1.0.7-rc7.zip
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Download pinned reference assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/downloads/openmw build/downloads/cp949 build/input/openmw build/input/cp949
          gh release download "$OPENMW_TAG" --repo "$OPENMW_REPO" --pattern "$OPENMW_ASSET" --dir build/downloads/openmw
          gh release download "$CP949_TAG" --repo "$CP949_REPO" --pattern "$CP949_ASSET" --dir build/downloads/cp949
          unzip -q "build/downloads/openmw/$OPENMW_ASSET" -d build/input/openmw
          unzip -q "build/downloads/cp949/$CP949_ASSET" -d build/input/cp949-outer
          nested="$(find build/input/cp949-outer -type f -name 'Korean Translation.zip' -print -quit)"
          test -n "$nested"
          unzip -q "$nested" -d build/input/cp949

      - name: Build and validate RC7 payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          python3 tools/port_openmw_kr1_topic_links.py \
            --openmw-root build/input/openmw \
            --cp949-root build/input/cp949 \
            --output-dir "$OUT_DIR"
          validation="$OUT_DIR/Morrowind_Korean_ReTranslation_KR1_TopicFix_Classic_CP949_validation.json"
          source_zip="$OUT_DIR/Morrowind_Korean_ReTranslation_KR1_TopicFix_Classic_CP949.zip"
          test "$(jq -r '.status' "$validation")" = PASS
          test "$(jq -r '.output.marker_only_info_changed' "$validation")" = 7692
          test "$(jq -r '.output.content_changes_skipped' "$validation")" = 177
          test "$(jq -r '.output.top_rows' "$validation")" = 5843
          test "$(jq -r '.output.mrk_rows' "$validation")" = 376
          test "$(jq -r '.output.unresolved_markers | length' "$validation")" = 0
          test "$(jq -r '.cp949_fallbacks | length' "$validation")" = 0
          test "$(jq -r '.checks.compiled_scripts_byte_identical' "$validation")" = true
          test "$(jq -r '.checks.classic_dials_byte_semantics_preserved' "$validation")" = true
          test "$(jq -r '.checks.only_expected_info_names_changed' "$validation")" = true
          test "$(jq -r '.checks.classic_voice_wilderness_fix_preserved' "$validation")" = true
          unzip -tq "$source_zip"
          cp "$source_zip" "$OUT_DIR/$RELEASE_ZIP"
          sha256sum "$OUT_DIR/$RELEASE_ZIP" "$validation" "$OUT_DIR/MO2/Morrowind_Korean_ReTranslation.esp" "$OUT_DIR/MO2/Morrowind_Korean_ReTranslation.top" "$OUT_DIR/MO2/Morrowind_Korean_ReTranslation.mrk" > "$OUT_DIR/SHA256SUMS.txt"

      - name: Package executable patcher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR/patcher"
          cp tools/patch_morrowind_cp949.py "$OUT_DIR/patcher/"
          cat > "$OUT_DIR/patcher/README.txt" <<'EOF'
          Morrowind CP949 executable patcher (RC7)

          This does NOT contain Morrowind.exe.

          Recommended input:
          1. Morrowind GOTY 1.6.0.1820
          2. Apply Morrowind Code Patch (MCP)
          3. Enable MCP Japanese localization compatibility
          4. Run this CP949 patcher on your own Morrowind.exe

          Current validated MCP Japanese-localization input SHA-256:
          a87ee7f9239023469d4c031e6dab87648a316ab8c1354e96c2478aca3376167c

          Expected CP949-patched output SHA-256 for that input:
          bff9c8381d59657e5dfbfc66058745996327b20f4516f63e54ce9c7f726b45fc

          Example:
          py -3 patch_morrowind_cp949.py Morrowind.exe Morrowind.MCP-Korean.exe

          The patch changes only the supported MCP executable's DBCS character handling routine.
          EOF
          (cd "$OUT_DIR/patcher" && zip -q -9 "../$PATCHER_ZIP" patch_morrowind_cp949.py README.txt)
          unzip -tq "$OUT_DIR/$PATCHER_ZIP"
          sha256sum "$OUT_DIR/$PATCHER_ZIP" >> "$OUT_DIR/SHA256SUMS.txt"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          validation="$OUT_DIR/Morrowind_Korean_ReTranslation_KR1_TopicFix_Classic_CP949_validation.json"
          zip_hash="$(sha256sum "$OUT_DIR/$RELEASE_ZIP" | awk '{print $1}')"
          patcher_hash="$(sha256sum "$OUT_DIR/$PATCHER_ZIP" | awk '{print $1}')"
          esp_hash="$(jq -r '.output.esp_sha256' "$validation")"
          top_hash="$(jq -r '.output.top_sha256' "$validation")"
          mrk_hash="$(jq -r '.output.mrk_sha256' "$validation")"
          cat > "$OUT_DIR/RELEASE_NOTES.md" <<EOF
          Classic Morrowind 1.6.0.1820용 CP949 한국어 번역 RC7 릴리스입니다.

          RC6 Classic CP949를 기반으로, 최신 OpenMW KR1에서 실제 사용하도록 정리된 다국어 토픽/키워드 링크 수정만 이식했습니다. 일반 번역 문장 수정은 섞지 않고 Classic 전용 compiled script 및 호환 보정을 그대로 유지합니다.

          ## 설치에 필요한 구성
          - RC7 번역 ZIP
          - MCP Japanese localization 호환이 적용된 자신의 \`Morrowind.exe\` + 이 Release의 CP949 실행 파일 패처
          - Classic CP949 FNT/TEX 폰트팩

          Bethesda의 \`Morrowind.exe\` 전체 파일은 이 Release에 포함하지 않습니다.

          ## RC7 핵심 변경
          - 번역문은 동일하고 명시적 \`@topic#\` 링크만 추가된 INFO **7,692개** 반영
          - OpenMW KR1 최종 TOP **5,843행**을 CP949로 변환해 포함
          - OpenMW KR1 최종 MRK **376행**을 CP949로 변환해 포함
          - 일반 번역 내용이 달라진 INFO **177개는 의도적으로 제외**
          - Classic CP949 RC6 compiled SCPT **236개 바이트 그대로 보존**
          - Classic 전용 Voice \`ANAM=\"Wilderness\"\` 보정 유지

          ## 실행 파일 패처
          - MCP Japanese localization 적용 기준 입력 SHA-256: \`a87ee7f9239023469d4c031e6dab87648a316ab8c1354e96c2478aca3376167c\`
          - 위 입력의 CP949 패치 출력 SHA-256: \`bff9c8381d59657e5dfbfc66058745996327b20f4516f63e54ce9c7f726b45fc\`

          ## 검증
          - 미해결 토픽 마커: **0**
          - CP949 변환 fallback: **0**
          - compiled SCPT byte-identical: **PASS**
          - DIAL 구조/의미 보존: **PASS**
          - 예상한 INFO NAME 외 변경 없음: **PASS**
          - ZIP 무결성 검사: **PASS**

          ## SHA-256
          - 번역 ZIP: \`$zip_hash\`
          - 실행 파일 패처 ZIP: \`$patcher_hash\`
          - ESP: \`$esp_hash\`
          - TOP: \`$top_hash\`
          - MRK: \`$mrk_hash\`
          EOF

      - name: Create or update RC7 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          validation="$OUT_DIR/Morrowind_Korean_ReTranslation_KR1_TopicFix_Classic_CP949_validation.json"
          assets=("$OUT_DIR/$RELEASE_ZIP" "$OUT_DIR/$PATCHER_ZIP" "$validation" "$OUT_DIR/SHA256SUMS.txt")
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target main --title 'Morrowind Classic CP949 v1.0.7-rc7' --notes-file "$OUT_DIR/RELEASE_NOTES.md" --prerelease=false --latest
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "${assets[@]}" --clobber
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --title 'Morrowind Classic CP949 v1.0.7-rc7' --notes-file "$OUT_DIR/RELEASE_NOTES.md" --latest "${assets[@]}"
          fi
