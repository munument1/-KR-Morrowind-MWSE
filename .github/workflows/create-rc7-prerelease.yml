name: Create RC7 Classic CP949 release

on:
  push:
    branches: [main]
    paths:
      - 'tools/port_openmw_kr1_topic_links.py'
      - 'tools/patch_morrowind_cp949.py'
      - 'tools/Apply_CP949_Patch.bat'
      - '.github/workflows/create-rc7-prerelease.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      OPENMW_REPO: munument1/-KR-openmw
      OPENMW_TAG: openmw-0.51.0-kr1
      OPENMW_ASSET: Morrowind-Korean-OpenMW-0.51.0-KR1-Full.zip
      CP949_REPO: munument1/-KR-Morrowind-MWSE
      CP949_TAG: v1.0.7-rc6-classic-cp949-pre1
      CP949_ASSET: Morrowind_Korean_ReTranslation_v1.0.7-rc6_Classic_CP949.zip
      CP949_ASSET_SHA256: 0dc5f9ec99544dc12560f5844c8d0cf019e9214925ebbac50af4b3e5e51e891e
      TAG: v1.0.7-rc7-classic-cp949
      OUT_DIR: build/rc7
      FULL_ZIP: Morrowind_Classic_CP949_Korean_v1.0.7-rc7_Full.zip
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Download pinned reference assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/downloads/openmw build/downloads/cp949 build/input/openmw build/input/cp949
          gh release download "$OPENMW_TAG" --repo "$OPENMW_REPO" --pattern "$OPENMW_ASSET" --dir build/downloads/openmw
          gh release download "$CP949_TAG" --repo "$CP949_REPO" --pattern "$CP949_ASSET" --dir build/downloads/cp949
          echo "$CP949_ASSET_SHA256  build/downloads/cp949/$CP949_ASSET" | sha256sum -c -
          unzip -q "build/downloads/openmw/$OPENMW_ASSET" -d build/input/openmw
          unzip -q "build/downloads/cp949/$CP949_ASSET" -d build/input/cp949-outer
          nested="$(find build/input/cp949-outer -type f -name 'Korean Translation.zip' -print -quit)"
          test -n "$nested"
          unzip -q "$nested" -d build/input/cp949

      - name: Build and validate RC7 translation payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          python3 tools/port_openmw_kr1_topic_links.py \
            --openmw-root build/input/openmw \
            --cp949-root build/input/cp949 \
            --output-dir "$OUT_DIR"

          validation="$OUT_DIR/Morrowind_Korean_ReTranslation_KR1_TopicFix_Classic_CP949_validation.json"
          test "$(jq -r '.status' "$validation")" = PASS
          test "$(jq -r '.output.marker_only_info_changed' "$validation")" = 7692
          test "$(jq -r '.output.content_changes_skipped' "$validation")" = 177
          test "$(jq -r '.output.top_rows' "$validation")" = 5843
          test "$(jq -r '.output.mrk_rows' "$validation")" = 376
          test "$(jq -r '.output.unresolved_markers | length' "$validation")" = 0
          test "$(jq -r '.cp949_fallbacks | length' "$validation")" = 0
          test "$(jq -r '.checks.compiled_scripts_byte_identical' "$validation")" = true
          test "$(jq -r '.checks.classic_dials_byte_semantics_preserved' "$validation")" = true
          test "$(jq -r '.checks.only_expected_info_names_changed' "$validation")" = true
          test "$(jq -r '.checks.classic_voice_wilderness_fix_preserved' "$validation")" = true

      - name: Assemble one full-install package
        shell: bash
        run: |
          set -euo pipefail
          full="$OUT_DIR/full"
          data="$full/Data Files"
          mkdir -p "$data/Fonts"

          # Translation payload: direct Classic Data Files layout.
          cp "$OUT_DIR/MO2/Morrowind_Korean_ReTranslation.esp" "$data/"
          cp "$OUT_DIR/MO2/Morrowind_Korean_ReTranslation.top" "$data/"
          cp "$OUT_DIR/MO2/Morrowind_Korean_ReTranslation.mrk" "$data/"

          # RC6 Classic CP949 fonts: reuse exact FNT/TEX bytes.
          src='build/input/cp949-outer/Morrowind/Data Files/Fonts'
          test -d "$src"
          cp -p "$src"/*.fnt "$src"/*.tex "$data/Fonts/"
          test "$(find "$data/Fonts" -type f | wc -l)" = 8

          (cd "$full" && sha256sum -c - <<'EOF'
          a4100e60a1bac906c9b1c631d6302b337db3b3f6cec1dca6c4c870d018c384da  Data Files/Fonts/Magic_Cards_Regular.fnt
          2bc62d3aa56375e118e9cd172a1c1be4a5d40619a537f917eb8acced607c6284  Data Files/Fonts/Magic_Cards_Regular_0_Lod_A.tex
          478eb1f662282b45900e966909824d9fdadd32ab2466d4321dd000d2bdb774b1  Data Files/Fonts/century_gothic_big.fnt
          849d052c9fdec6610a54edf19c1a10617f91502c8e7ba1ae0941791282a3e0ff  Data Files/Fonts/century_gothic_big_0_Lod_A.tex
          3b9fe4504f407b90899ce288883c644a4a34aee0abec3274e90e32339c4c5e69  Data Files/Fonts/century_gothic_font_regular.fnt
          91602af559c7e0774907523c79a8b9ec73280f84b2787ee1b5ff9b743c05f306  Data Files/Fonts/century_gothic_font_regular_0_Lod_A.tex
          328cde4221991945c4b42d78e67fad84645c2110967c42f403bbcde717d9ef0d  Data Files/Fonts/daedric_font.fnt
          6af53d3fcb43653e125611acc74314320fd09ba5e23d5eee7a97c56deabd0aa3  Data Files/Fonts/daedric_font_0_Lod_A.tex
          EOF
          )

          # User-facing executable patcher: Windows BAT only, no Python required.
          cp tools/Apply_CP949_Patch.bat "$full/Apply_CP949_Patch.bat"
          test -s "$full/Apply_CP949_Patch.bat"
          grep -q 'a87ee7f9239023469d4c031e6dab87648a316ab8c1354e96c2478aca3376167c' "$full/Apply_CP949_Patch.bat"
          grep -q 'bff9c8381d59657e5dfbfc66058745996327b20f4516f63e54ce9c7f726b45fc' "$full/Apply_CP949_Patch.bat"
          grep -q '0x3457C0' "$full/Apply_CP949_Patch.bat"

          cat > "$full/README_RC7.txt" <<'EOF'
          Morrowind Classic CP949 Korean v1.0.7-rc7 - Full package

          This ZIP contains everything distributed by this project in one archive:
          - Data Files/Morrowind_Korean_ReTranslation.esp
          - Data Files/Morrowind_Korean_ReTranslation.top
          - Data Files/Morrowind_Korean_ReTranslation.mrk
          - Data Files/Fonts/*.fnt + *.tex (the same 8 Classic CP949 font files used by RC6)
          - Apply_CP949_Patch.bat

          Morrowind.exe itself is NOT included.
          Python is NOT required.

          Install:
          1. Prepare Morrowind GOTY 1.6.0.1820.
          2. Apply Morrowind Code Patch (MCP).
          3. Enable MCP Japanese localization compatibility.
          4. Extract this ZIP into the Morrowind game directory so Data Files merges with the existing Data Files folder.
          5. Double-click Apply_CP949_Patch.bat in the Morrowind game folder.
          6. The BAT verifies Morrowind.exe, creates Morrowind.exe.cp949-backup, then patches Morrowind.exe in place.
          7. Enable Morrowind_Korean_ReTranslation.esp and disable older Korean translation ESPs.

          The BAT uses Windows PowerShell included with Windows. No Python installation is needed.

          Validated MCP Japanese-localization input SHA-256:
          a87ee7f9239023469d4c031e6dab87648a316ab8c1354e96c2478aca3376167c

          Expected CP949-patched output SHA-256 for that input:
          bff9c8381d59657e5dfbfc66058745996327b20f4516f63e54ce9c7f726b45fc
          EOF

          # Deterministic full ZIP.
          python3 - <<'PY'
          from pathlib import Path
          import os, zipfile
          root = Path(os.environ['OUT_DIR']) / 'full'
          out = Path(os.environ['OUT_DIR']) / os.environ['FULL_ZIP']
          files = sorted(p for p in root.rglob('*') if p.is_file())
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in files:
                  arc = path.relative_to(root).as_posix()
                  info = zipfile.ZipInfo(arc, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  zf.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          PY
          unzip -tq "$OUT_DIR/$FULL_ZIP"

          validation="$OUT_DIR/Morrowind_Korean_ReTranslation_KR1_TopicFix_Classic_CP949_validation.json"
          : > "$OUT_DIR/SHA256SUMS.txt"
          sha256sum "$OUT_DIR/$FULL_ZIP" >> "$OUT_DIR/SHA256SUMS.txt"
          sha256sum "$validation" >> "$OUT_DIR/SHA256SUMS.txt"
          sha256sum "$data/Morrowind_Korean_ReTranslation.esp" "$data/Morrowind_Korean_ReTranslation.top" "$data/Morrowind_Korean_ReTranslation.mrk" >> "$OUT_DIR/SHA256SUMS.txt"
          sha256sum "$data/Fonts/"* >> "$OUT_DIR/SHA256SUMS.txt"
          sha256sum "$full/Apply_CP949_Patch.bat" >> "$OUT_DIR/SHA256SUMS.txt"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          validation="$OUT_DIR/Morrowind_Korean_ReTranslation_KR1_TopicFix_Classic_CP949_validation.json"
          full_hash="$(sha256sum "$OUT_DIR/$FULL_ZIP" | awk '{print $1}')"
          esp_hash="$(jq -r '.output.esp_sha256' "$validation")"
          top_hash="$(jq -r '.output.top_sha256' "$validation")"
          mrk_hash="$(jq -r '.output.mrk_sha256' "$validation")"
          cat > "$OUT_DIR/RELEASE_NOTES.md" <<EOF
          Classic Morrowind 1.6.0.1820용 CP949 한국어 번역 RC7 정식 릴리스입니다.

          ## 한 파일 합본
          일반 사용자는 **\`$FULL_ZIP\` 하나만 받으면 됩니다.**

          합본 ZIP 안에 다음을 모두 포함합니다.
          - RC7 번역 ESP/TOP/MRK
          - RC6에서 실제 사용하던 Classic CP949 FNT/TEX 폰트 8개
          - **\`Apply_CP949_Patch.bat\`** — Python 설치 없이 더블클릭하는 실행 파일 패처

          Bethesda의 \`Morrowind.exe\` 자체는 포함하지 않습니다.

          ## 설치 순서
          1. Morrowind GOTY 1.6.0.1820 준비
          2. MCP 적용 및 **Japanese localization compatibility** 활성화
          3. 합본 ZIP을 Morrowind 게임 폴더에 풀어 \`Data Files\`를 병합
          4. 게임 폴더의 **\`Apply_CP949_Patch.bat\` 더블클릭**
          5. BAT가 원본 \`Morrowind.exe\`를 백업하고 CP949 패치를 적용
          6. \`Morrowind_Korean_ReTranslation.esp\` 활성화

          BAT는 Windows 기본 PowerShell을 내부적으로 사용하므로 **Python은 필요 없습니다.**

          ## RC7 핵심 변경
          - 명시적 \`@topic#\` 링크 INFO **7,692개** 반영
          - OpenMW KR1 최종 TOP **5,843행** CP949 변환
          - OpenMW KR1 최종 MRK **376행** CP949 변환
          - 일반 번역 내용 변경 INFO **177개 제외**
          - Classic compiled SCPT **236개 byte-identical**
          - 미해결 토픽 마커 **0**
          - CP949 변환 fallback **0**
          - RC6 폰트 8개 byte-identical **PASS**

          ## 실행 파일 패처 기준
          - 검증된 MCP Japanese-localization 입력 SHA-256: \`a87ee7f9239023469d4c031e6dab87648a316ab8c1354e96c2478aca3376167c\`
          - 위 입력의 CP949 패치 출력 SHA-256: \`bff9c8381d59657e5dfbfc66058745996327b20f4516f63e54ce9c7f726b45fc\`

          ## SHA-256
          - Full ZIP: \`$full_hash\`
          - ESP: \`$esp_hash\`
          - TOP: \`$top_hash\`
          - MRK: \`$mrk_hash\`
          EOF

      - name: Publish full RC7 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          validation="$OUT_DIR/Morrowind_Korean_ReTranslation_KR1_TopicFix_Classic_CP949_validation.json"
          assets=("$OUT_DIR/$FULL_ZIP" "$validation" "$OUT_DIR/SHA256SUMS.txt")

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target main --title 'Morrowind Classic CP949 v1.0.7-rc7' --notes-file "$OUT_DIR/RELEASE_NOTES.md" --prerelease=false --latest
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "${assets[@]}" --clobber
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --title 'Morrowind Classic CP949 v1.0.7-rc7' --notes-file "$OUT_DIR/RELEASE_NOTES.md" --latest "${assets[@]}"
          fi

          # Remove old split user-facing ZIPs if any remain.
          for old in \
            Morrowind_Korean_ReTranslation_v1.0.7-rc7_Classic_CP949.zip \
            Morrowind_CP949_Executable_Patcher_v1.0.7-rc7.zip \
            Morrowind_CP949_Classic_Fonts.zip; do
            gh release delete-asset "$TAG" "$old" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          done

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | {name: .name, size: .size, digest: .digest}'
