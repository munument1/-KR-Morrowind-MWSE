name: Audit RC7 GMST duplicates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-rc7-gmst-duplicates.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Download RC7
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/a/full build/a/mo2
          gh release download v1.0.7-rc7-classic-cp949 --repo "$GITHUB_REPOSITORY" --pattern 'Morrowind_Classic_CP949_Korean_v1.0.7-rc7_Full.zip' --dir build/a
          unzip -q build/a/Morrowind_Classic_CP949_Korean_v1.0.7-rc7_Full.zip -d build/a/full
          unzip -q build/a/full/Morrowind_Korean_ReTranslation_v1.0.7-rc7_MO2.zip -d build/a/mo2
      - name: Inspect selected GMST records
        shell: bash
        run: |
          python3 - <<'PY'
          import struct, json
          from pathlib import Path
          p=Path('build/a/mo2/Morrowind_Korean_ReTranslation.esp')
          data=p.read_bytes(); off=0
          targets={'sMessageQuestionAnswer1','sMessageQuestionAnswer2','sMessageQuestionAnswer3','sCreateClassMenuWarning','sChooseClassMenu1','sChooseClassMenu2','sChooseClassMenu3','sChooseClassMenu4','sYes','sNo'}
          vals={k:[] for k in targets}
          while off+16<=len(data):
              typ=data[off:off+4]
              size=struct.unpack_from('<I',data,off+4)[0]
              rec=data[off+16:off+16+size]
              if typ==b'GMST':
                  pos=0; name=None; value=None; rawlen=None; nullterm=None
                  while pos+8<=len(rec):
                      sn=rec[pos:pos+4]; ss=struct.unpack_from('<I',rec,pos+4)[0]; sv=rec[pos+8:pos+8+ss]; pos+=8+ss
                      if sn==b'NAME': name=sv.split(b'\0',1)[0].decode('ascii','replace')
                      elif sn==b'STRV':
                          rawlen=len(sv); nullterm=bool(sv and sv[-1]==0); value=sv.rstrip(b'\0').decode('cp949','replace')
                  if name in vals: vals[name].append({'value':value,'rawlen':rawlen,'nullterm':nullterm})
              off+=16+size
          for k in sorted(targets): print(json.dumps({'key':k,'records':vals[k]},ensure_ascii=True))
          PY
